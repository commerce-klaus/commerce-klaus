name: Release Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts -- --link-workspace-packages

      - name: Bootstrap workspace packages
        run: vp run --no-cache --filter "./packages/*" build

      - name: Create or update release PR
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: vp run version-packages-lockfile
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages
        if: steps.changesets.outputs.has-changesets == 'false'
        run: vp run release
        env:
          DEBUG: "*"
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_LOGLEVEL: verbose

      - name: Create tags and GitHub releases
        id: publish
        if: steps.changesets.outputs.has-changesets == 'false'
        uses: changesets/action/publish@v2.1.2
        with:
          script: pnpm run release:output
          create-github-releases: true
          push-git-tags: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release diagnostics
        if: always()
        run: |
          set -euo pipefail
          echo "publish.outputs.published=${{ steps.publish.outputs.published }}"
          echo "publish.outputs.publishedPackages=${{ steps.publish.outputs.published-packages }}"
          echo "Tags on HEAD:"
          git tag --points-at HEAD || true
