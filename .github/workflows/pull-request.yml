name: Pull Request CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        if: ${{ !startsWith(github.ref, 'refs/heads/changeset-release/') && !startsWith(github.head_ref, 'changeset-release/') }}
        run: vp install --frozen-lockfile --ignore-scripts -- --link-workspace-packages

      - name: Install dependencies (changeset release branches)
        if: ${{ startsWith(github.ref, 'refs/heads/changeset-release/') || startsWith(github.head_ref, 'changeset-release/') }}
        run: vp install --no-frozen-lockfile --ignore-scripts -- --link-workspace-packages

      - name: Bootstrap workspace packages
        run: vp run --no-cache --filter "./packages/*" build

      - name: Set up example B2C plugin
        run: cd examples/eslint-typescript-sfcc && vp run setup:b2c-plugin

      - name: Generate example SFCC types
        run: cd examples/eslint-typescript-sfcc && vp run types:sfcc:sync

      - name: Run checks
        run: vp check

      - name: Run tests
        run: vp run -r test

      - name: Run builds
        run: vp run -r build
