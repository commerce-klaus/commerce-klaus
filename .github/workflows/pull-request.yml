name: Pull Request CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        if: ${{ !startsWith(github.ref, 'refs/heads/changeset-release/') && !startsWith(github.head_ref, 'changeset-release/') }}
        run: vp install --frozen-lockfile -- --link-workspace-packages

      - name: Install dependencies (changeset release branches)
        if: ${{ startsWith(github.ref, 'refs/heads/changeset-release/') || startsWith(github.head_ref, 'changeset-release/') }}
        run: vp install --no-frozen-lockfile -- --link-workspace-packages

      - name: Bootstrap shared resolver package
        run: cd packages/sfcc-module-resolver && vp pack

      - name: Bootstrap SFCC test runtime package
        run: cd packages/sfcc-test-runtime && vp pack

      - name: Bootstrap TypeScript tooling package
        run: cd packages/typescript-sfcc && vp pack

      - name: Bootstrap ESLint config package
        run: cd packages/eslint-config-sfcc && vp pack

      - name: Generate example SFCC types
        run: cd examples/eslint-typescript-sfcc && vp run types:sfcc:sync

      - name: Run checks
        run: vp check

      - name: Run tests
        run: vp run -r test

      - name: Run builds
        run: vp run -r build
