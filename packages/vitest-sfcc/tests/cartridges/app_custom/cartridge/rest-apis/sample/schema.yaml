openapi: 3.0.0
info:
  title: Sample API
  version: 1.0.0
paths:
  /samples/{sampleId}:
    get:
      operationId: getSample
      parameters:
        - in: path
          name: sampleId
          required: true
          schema:
            type: string
        - in: query
          name: locale
          schema:
            type: string
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  locale:
                    type: string
                  sampleId:
                    type: string
