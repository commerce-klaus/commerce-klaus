packages:
  - apps/*
  - packages/*
  - tools/*
  - examples/*

catalogMode: manual
cleanupUnusedCatalogs: true

catalog:
  "@eslint/js": ^10.0.1
  "@oclif/core": ^4.8.0
  "@salesforce/b2c-cli": ^2.0.0
  "@types/node": ^24
  "@typescript-eslint/eslint-plugin": ^8.68.0
  "@typescript-eslint/parser": ^8.68.0
  "@vitest/coverage-v8": 5.0.3
  acorn: ^8.18.0
  acorn-walk: ^8.3.5
  eslint: ^10.0.1
  eslint-plugin-sonarjs: ^4.2.0
  eslint-plugin-unicorn: ^76.0.0
  fast-xml-parser: ^5.8.0
  globals: ^17.4.0
  oxlint: ^1.79.0
  typescript: npm:@typescript/typescript6@^6.0.2
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 5.0.3
  vite-plus: latest
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  protobufjs: false
  yarn: false
minimumReleaseAgeExclude:
  - "@commerce-klaus/sfcc-module-resolver@1.1.0"
